name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check source and tests
        run: |
          python -m pip install ruff==0.14.14
          ruff check src tests quickstart/run_quickstart.py

  source-tests:
    name: Source tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source checkout
        run: python -m pip install -e . pytest
      - name: Run complete source test suite
        run: python -m pytest -q

  wheel-smoke-test:
    name: Built wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel outside the source tree
        run: |
          python -m venv /tmp/edgemap-wheel
          /tmp/edgemap-wheel/bin/python -m pip install dist/*.whl
      - name: Verify installed release surface
        working-directory: /tmp
        run: |
          /tmp/edgemap-wheel/bin/python - <<'PY'
          import importlib.util
          import pkgutil

          import edgemap
          from edgemap import PipelineConfig
          from edgemap.spatial import build_spatial_graph

          assert edgemap.__version__
          assert PipelineConfig().output_dir == "results"
          assert callable(build_spatial_graph)

          shipped = {module.name for module in pkgutil.iter_modules(edgemap.__path__)}
          expected_core = {
              "_matrix",
              "annotation",
              "cli",
              "config",
              "pipeline",
              "regression",
              "scores",
              "spatial",
          }
          excluded_experimental = {"genetic_response", "response", "simulation", "tests"}

          assert expected_core <= shipped, sorted(shipped)
          assert shipped.isdisjoint(excluded_experimental), sorted(shipped)
          for name in excluded_experimental:
              assert importlib.util.find_spec(f"edgemap.{name}") is None
          PY
